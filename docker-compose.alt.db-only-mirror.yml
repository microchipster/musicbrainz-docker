# Description: Database-only mirror, as an alternative to 'default'

volumes:
  pgdata:
  dbdump:

services:
  db:
    build:
      context: build/postgres-prebuilt
    image: musicbrainz-docker_db:${POSTGRES_VERSION:-18}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"
    restart: unless-stopped
    command: postgres -c "shared_buffers=2048MB" -c "maintenance_work_mem=1024MB" -c "wal_compression=on" -c "max_wal_size=16GB" -c "checkpoint_timeout=30min" -c "checkpoint_completion_target=0.9" -c "max_parallel_maintenance_workers=0" -c "max_parallel_workers_per_gather=0" -c "max_parallel_workers=0" -c "jit=off"
    env_file:
      - ./default/postgres.env
    shm_size: "2GB"
    volumes:
      - pgdata:/var/lib/postgresql
    expose:
      - "5432"

  musicbrainz:
    build:
      context: build/musicbrainz-prebuilt
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "50"
    volumes:
      - dbdump:/media/dbdump
    restart: unless-stopped
    env_file:
      - ./default/postgres.env
    environment:
      - MUSICBRAINZ_BASE_FTP_URL=${MUSICBRAINZ_BASE_FTP_URL:-}
      - MUSICBRAINZ_BASE_DOWNLOAD_URL=${MUSICBRAINZ_BASE_DOWNLOAD_URL:-https://data.metabrainz.org/pub/musicbrainz}
      - MUSICBRAINZ_WEB_SERVER_HOST=${MUSICBRAINZ_WEB_SERVER_HOST:-localhost}
      - MUSICBRAINZ_WEB_SERVER_PORT=${MUSICBRAINZ_WEB_SERVER_PORT:-5000}
    command: load-crontab-only.sh
    depends_on:
      - db
      - valkey

  valkey:
    image: valkey/valkey:9-alpine
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"
    restart: unless-stopped
    expose:
      - "6379"
